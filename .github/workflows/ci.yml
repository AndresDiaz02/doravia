name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests and builds
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doravia_test_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d doravia_test_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: API typecheck
        run: pnpm --filter @workspace/api build
      - name: API tests
        run: pnpm --filter @workspace/api test
        env:
          # Las pruebas unitarias inicializan el cliente Drizzle, aunque no se
          # conectan a PostgreSQL. Evita que la ausencia de esta variable
          # oculte fallos reales de la suite.
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/doravia_test_qa
      - name: API PostgreSQL integration tests
        run: pnpm --filter @workspace/api test:integration
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/doravia_test_qa
      - name: ERP build
        run: pnpm --filter @workspace/web build
      - name: POS build
        run: pnpm --filter @workspace/pos build
