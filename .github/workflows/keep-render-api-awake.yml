name: Keep Render API awake

on:
  schedule:
    # Render Free suspende servicios inactivos. Este ping ligero mantiene
    # disponible el inicio de sesión sin tocar datos ni ejecutar operaciones.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    # Render Free puede tardar más de un minuto en despertar tras una pausa o despliegue.
    # Este trabajo mantiene caliente la API; no debe generar correos por una
    # indisponibilidad transitoria. Los errores quedan como warning en el run.
    timeout-minutes: 10
    steps:
      - name: Verify API health
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if curl --fail --silent --show-error --connect-timeout 30 --max-time 120 https://doravia-api.onrender.com/live; then
              exit 0
            fi
            echo "Intento ${attempt}/4 sin respuesta; se reintentará."
            sleep 20
          done
          echo "::warning::La API no respondió al monitor. El flujo se completa para evitar alertas repetitivas por cold starts."
