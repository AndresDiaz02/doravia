name: P0 POS PostgreSQL integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pos-transactional-integrity:
    name: POS transactional integrity (ephemeral PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doravia_test_p0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d doravia_test_p0"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/doravia_test_p0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Initialize isolated PostgreSQL schema
        run: |
          pnpm --filter @workspace/db push
          pnpm --filter @workspace/db migrate
      # Solo para la rama temporal de evaluación: QA-002 restablece el esquema
      # validado y ejecuta ambas suites sobre el mismo PostgreSQL efímero.
      - name: Run combined QA-002 and P0-INT-001 suites
        run: pnpm --filter @workspace/api test:integration
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/doravia_test_p0
          DORAVIA_QA_ALLOW_SCHEMA_RESET: "true"
          DORAVIA_QA_ALLOW_CONTAINER_SERVER: "true"
      # Se repite sin reiniciar el esquema: evidencia que afterAll/finally no
      # deja triggers, sesiones ni registros de tenants de prueba.
      - name: Repeat combined suites without schema reset
        run: pnpm --filter @workspace/api exec vitest run --config vitest.integration.config.ts
      - name: Reapply isolated migrations (drift check)
        run: |
          pnpm --filter @workspace/db push
          pnpm --filter @workspace/db migrate
