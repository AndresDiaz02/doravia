name: Temporary QA-002 + P0-INT-001 integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doravia_test_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d doravia_test_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run QA-002 and P0-INT-001 against one ephemeral schema
        run: pnpm --filter @workspace/api test:integration
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/doravia_test_integration
          DORAVIA_QA_ALLOW_SCHEMA_RESET: "true"
          DORAVIA_QA_ALLOW_CONTAINER_SERVER: "true"
