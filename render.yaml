services:
  - type: web
    name: doravia-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/api build
    # Se ejecuta antes de reemplazar el servicio. migrate.ts es idempotente y
    # además detiene el despliegue si detecta que el schema real tiene drift.
    # Para una base nueva, inicializar primero con el procedimiento de OPERACIONES.md.
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm --filter @workspace/api start
    # Solo valida que el proceso de Node está vivo. La comprobación /health
    # conserva el diagnóstico de Neon, pero no reinicia la API por una latencia
    # puntual de la base de datos.
    healthCheckPath: /live
    envVars:
      # Configuracion publica/estable. Los secretos se cargan en el panel de Render.
      - key: NODE_ENV
        value: production
      - key: DIAN_PROVEEDOR
        value: plemsi
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: FUNDADOR_EMAILS
        sync: false
      - key: FUNDADOR_PIN
        sync: false
      - key: NOMINA_MODO
        value: pruebas
